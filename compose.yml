name: nginx-stack

services:
  nginx:
    image: "${NGINX_IMAGE:?Set NGINX_IMAGE in .env}"
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/snippets:/etc/nginx/snippets:ro
      - ./letsencrypt/conf:/etc/letsencrypt:ro
      - ./letsencrypt/www:/var/www/certbot:ro
      - ./static:/srv/sites:ro
    logging:
      driver: local

  certbot:
    image: "${CERTBOT_IMAGE:?Set CERTBOT_IMAGE in .env}"
    profiles: [tools]
    network_mode: host
    volumes:
      - ./letsencrypt/conf:/etc/letsencrypt
      - ./letsencrypt/www:/var/www/certbot
      - ./letsencrypt/logs:/var/log/letsencrypt
